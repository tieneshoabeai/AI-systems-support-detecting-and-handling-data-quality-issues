global:
  scrape_interval: 5s
  evaluation_interval: 15s

# Metric của k6 đến qua remote write (/api/v1/write), không cần scrape.
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]

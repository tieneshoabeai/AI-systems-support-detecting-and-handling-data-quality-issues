<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Glass Cube — Preview harness</title>
    <link rel="icon" href="/vite.svg" />
    <style>
      :root {
        color-scheme: dark;
        --violet: #b07bff;
        --ink: #04010a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--ink);
        color: #d9c8ff;
        font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        padding: 14px 20px;
        border-bottom: 1px solid rgba(176, 123, 255, 0.18);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 11px;
      }
      header h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: #f1e9ff;
      }
      header span {
        color: rgba(217, 200, 255, 0.55);
      }
      header .controls {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        text-transform: none;
        letter-spacing: 0;
      }
      header .hint {
        text-transform: none;
        letter-spacing: 0;
        font-size: 10px;
        color: rgba(217, 200, 255, 0.38);
      }
      header button {
        padding: 6px 12px;
        border: 1px solid rgba(176, 123, 255, 0.4);
        border-radius: 999px;
        background: rgba(176, 123, 255, 0.08);
        color: #e7d9ff;
        font: inherit;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
      }
      header button:hover {
        background: rgba(176, 123, 255, 0.2);
      }
      header button[aria-pressed='true'] {
        border-color: rgba(255, 128, 220, 0.8);
        background: rgba(255, 80, 200, 0.18);
        color: #ffd9f4;
      }
      #stage {
        position: relative;
        min-height: 0;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #status {
        position: absolute;
        left: 20px;
        bottom: 16px;
        margin: 0;
        font-size: 11px;
        color: rgba(217, 200, 255, 0.6);
        pointer-events: none;
      }
      #status.error {
        color: #ff7fa8;
      }
      body.ui-hidden header,
      body.ui-hidden #status {
        display: none;
      }
      body.ui-hidden {
        grid-template-rows: 1fr;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Neon Glass Cube</h1>
      <span>harness dev · spec B · không thuộc app</span>
      <span id="view-label">azimuth 45° / elevation 24°</span>
      <div class="controls">
        <button id="explode-toggle" type="button" aria-pressed="false">Tách khối</button>
        <button id="clay-toggle" type="button" aria-pressed="false">Clay</button>
        <button id="view-reset" type="button">Góc 45°</button>
        <span class="hint">kéo để xoay · lăn để zoom · phải-chuột để pan</span>
      </div>
    </header>
    <div id="stage" aria-label="Mô hình neon glass cube"></div>
    <p id="status" role="status">Đang khởi tạo WebGL…</p>
    <script type="module" src="./neon-cube.preview.ts"></script>
  </body>
</html>
